[project]
name = "reeve-panel"
version = "1.1.7"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi", "uvicorn", "jinja2", "python-multipart", "argon2-cffi", "pyyaml",
]

[dependency-groups]
dev = ["pytest", "httpx", "playwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
